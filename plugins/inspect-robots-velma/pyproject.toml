[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "inspect-robots-velma"
version = "0.1.0"
description = "Inspect Robots adapter for the VELMA SO-101 MCP simulator."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "inspect-robots>=0.61",
    "mcp>=1.27,<2",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "mypy>=1.11", "ruff>=0.6"]

[project.entry-points."inspect_robots.embodiments"]
velma = "inspect_robots_velma:velma_embodiment"

[project.entry-points."inspect_robots.tasks"]
velma-pick-place = "inspect_robots_velma.task:velma_pick_place_task"

[project.entry-points."inspect_robots.scorers"]
velma-cube-in-container = "inspect_robots_velma.task:velma_cube_in_container"

[tool.uv.sources]
inspect-robots = { workspace = true }

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_robots_velma"]

[tool.hatch.build.targets.sdist]
include = ["src/inspect_robots_velma", "tests", "README.md"]

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.isort]
known-first-party = ["inspect_robots", "inspect_robots_velma"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]

[tool.mypy]
strict = true
